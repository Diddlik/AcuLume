name: Release

# Tag a commit as v0.2.0 and push the tag; the version in the artifacts comes from the tag, because
# that is what the in-app updater compares against.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0)'
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' }
               else { '${{ github.event.inputs.version }}' }
          if (-not $v) { throw 'No version resolved' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Restore tools
        run: dotnet tool restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish and pack
        shell: pwsh
        run: ./build/publish-windows.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload to the GitHub release
        run: >
          dotnet vpk upload github
          --outputDir build/releases
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag v${{ steps.version.outputs.value }}
          --releaseName "AcuLume ${{ steps.version.outputs.value }}"
          --publish true
          --merge true
